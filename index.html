<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moments Together · 4 Months</title>
<meta name="description" content="Four months of us.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#F9E8EC;
  --petal:#F2C7D3;
  --rose:#C23B66;
  --wine:#4A1230;
  --thread:#B8893B;
  --ink:#3A1026;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--blush);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;font-size:1.05rem;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* HERO */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:4rem 1.5rem;position:relative;background:
  radial-gradient(ellipse at 50% 0%,#fff6f8 0%,transparent 60%),var(--blush)}
.hero-inner{max-width:900px}
.hero p.pre{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--rose)}
.hero h1{font-family:var(--serif);font-weight:600;line-height:.9;font-size:clamp(5rem,22vw,15rem);color:var(--wine);letter-spacing:-.03em;margin:.5rem 0}
.hero h1 span{display:block;font-style:italic;font-weight:400;font-size:.32em;letter-spacing:0;color:var(--rose);margin-top:.1em}
.hero .names{font-family:var(--serif);font-size:clamp(1.4rem,4vw,2rem);margin-top:1.5rem}
.hero .names b{font-weight:400;color:var(--rose);font-style:italic;padding:0 .4em}
.thread{position:absolute;left:50%;bottom:0;width:1px;height:70px;background:var(--thread);transform-origin:top;animation:draw 2s ease-out .6s both}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* COUNTER */
.counter{background:var(--wine);color:var(--blush);text-align:center;padding:5rem 1.5rem}
.counter h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:2.5rem;color:var(--petal)}
.units{display:flex;justify-content:center;gap:clamp(1rem,5vw,4rem);flex-wrap:wrap}
.unit b{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(3rem,10vw,6rem);line-height:1;font-variant-numeric:tabular-nums}
.unit small{font-size:.95rem;color:var(--petal);letter-spacing:.05em}

/* GALLERY */
.gallery{padding:6rem 1.25rem;max-width:1200px;margin:0 auto}
.gallery h2,.letter h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);color:var(--wine);text-align:center;line-height:1.1}
.gallery .sub{text-align:center;font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--rose);margin:.5rem 0 3rem}
.grid{columns:3 260px;column-gap:1.25rem}
.photo{break-inside:avoid;margin:0 0 1.25rem;background:#fff;padding:.7rem .7rem 0;box-shadow:0 14px 30px -18px rgba(74,18,48,.45);cursor:pointer;border:0;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.photo:nth-child(3n+1){transform:rotate(-1.2deg)}
.photo:nth-child(3n+2){transform:rotate(.8deg)}
.photo:nth-child(3n){transform:rotate(-.4deg)}
.photo .frame{aspect-ratio:4/5;background:linear-gradient(135deg,var(--petal),#f7d9a8);overflow:hidden;display:grid;place-items:center;font-size:3rem}
.photo:nth-child(even) .frame{aspect-ratio:1/1}
.photo:nth-child(5n) .frame{aspect-ratio:3/4}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo figcaption{font-family:var(--serif);font-style:italic;font-size:1.2rem;padding:.8rem .2rem 1rem;color:var(--wine)}

/* LETTER */
.letter{background:#fff;padding:6rem 1.5rem}
.letter-box{max-width:640px;margin:0 auto}
.letter p{font-family:var(--serif);font-size:1.4rem;line-height:1.75;margin-top:1.4rem}
.letter .sign{text-align:right;color:var(--rose);font-style:italic;font-size:1.7rem;margin-top:2rem}

footer{text-align:center;padding:4rem 1.5rem 5rem;font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--rose)}
footer .heart{display:block;font-size:2rem;margin-bottom:.5rem;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}

/* LIGHTBOX */
.lb{position:fixed;inset:0;background:rgba(40,8,26,.92);display:none;place-items:center;z-index:10;padding:1.5rem}
.lb.open{display:grid}
.lb figure{max-width:min(92vw,900px);text-align:center;color:var(--blush)}
.lb img{max-width:100%;max-height:78vh;display:block;margin:0 auto}
.lb .ph{width:min(80vw,420px);aspect-ratio:4/5;background:linear-gradient(135deg,var(--petal),#f7d9a8);display:grid;place-items:center;font-size:4rem;margin:0 auto}
.lb figcaption{font-family:var(--serif);font-style:italic;font-size:1.5rem;margin-top:1rem}
.lb button{position:absolute;top:1rem;right:1.2rem;background:none;border:0;color:var(--blush);font-size:2.4rem;cursor:pointer;line-height:1}

@media (prefers-reduced-motion:reduce){.thread,footer .heart{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="pre">today we celebrate</p>
    <h1>4<span>months together</span></h1>
    <p class="names" id="names"></p>
  </div>
  <div class="thread" aria-hidden="true"></div>
</header>

<section class="counter" aria-labelledby="ch">
  <h2 id="ch">Since the day our story began</h2>
  <div class="units" role="timer" aria-live="off">
    <div class="unit"><b id="d">0</b><small>days</small></div>
    <div class="unit"><b id="h">0</b><small>hours</small></div>
    <div class="unit"><b id="m">0</b><small>minutes</small></div>
    <div class="unit"><b id="s">0</b><small>seconds</small></div>
  </div>
</section>

<section class="gallery" id="momentos">
  <h2>Our Moments</h2>
  <p class="sub">Every photo is a little piece of us</p>
  <div class="grid" id="grid"></div>
</section>

<section class="letter">
  <div class="letter-box">
    <h2>For You</h2>
    <div id="letter"></div>
    <p class="sign" id="sign"></p>
  </div>
</section>

<footer>
  <span class="heart" aria-hidden="true">♥</span>
  And this is just the beginning.
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Enlarged photo">
  <button id="lbclose" aria-label="Close">×</button>
  <figure id="lbfig"></figure>
</div>

<script>
/* ============ EDIT HERE ============ */
const CONFIG = {
  yourName: "Pedro ( Zapito >:p )",                 // your name
  herName: "Ambar ( Lil Princess :3)",              // your girlfriend's name
  start: "2026-07-18T00:00:00",  // date you started dating (YYYY-MM-DDTHH:MM:SS)
  signature: "Yours Fowever Mommy :3 ",
  letter: [
    "4 months, But it has felt like 10 years already :)",
    "I feel like I owed you this Ambar :), like i wanted to do somthing Beutiful For You :) </br> and maybe I have not been the best to you this days but just know </br> if I am doing this to You its because </br> I Love You Ambar :) </br> but if you ever feel not Loved, tell me ;) </br> We can Fix anything together :D </br> and the End its Us Agasint the World :3  ",
    "Thank you for being Someone that I can Love with All My Heart and Soul.",
    "You are the Most Important thing in My Whole Life and Will Always be."
  ],
  // Put your photos in the "fotos" folder using these names (or change the paths).
  // To add more photos: copy a line, change the file name and the caption.
  // Any photo that is missing just shows a 💗 placeholder.
  photos: [
    { src: "fotos/foto1.png",  text: "My Favorite Person, My Lil Princess" },
    { src: "fotos/foto2.jpg",  text: "Our First Date :3" },
    { src: "fotos/foto3.jpg",  text: "Moments I will Always Love :>" },
    { src: "fotos/foto4.png",  text: "Our Family :)" },
    { src: "fotos/foto5.jpg",  text: "Times I will Never Foget .3" },
    { src: "fotos/foto6.jpg",  text: "My First Real Smile in a While (:" },
    { src: "fotos/foto7.jpg",  text: "Woof >;) *if you know what i mean ;)*" },
    { src: "fotos/foto8.jpg",  text: "Times I wanted to be Beside you Sm D:" },
    { src: "fotos/foto9.png",  text: "Something I Love seeing You do ;)" },
    { src: "fotos/foto10.jpg", text: "Funny Moments Together (;" },
    { src: "fotos/foto11.jpg", text: "Yours Only (," },
    { src: "fotos/foto12.jpg", text: "My Fav Pic of Me ,p" },
    { src: "fotos/foto13.jpg", text: "Your Big Daddy Alpha ,p" },
    { src: "fotos/foto14.jpg", text: "Love is Beutiful <;" },
    { src: "fotos/foto15.jpg", text: "Soooo Beutifull ,3 " },
    { src: "fotos/foto16.jpg", text: "So beutiful Eating :) could be Me though (," },
    { src: "fotos/foto17.png", text: "Your Goat >:>" },
    { src: "fotos/foto18.png", text: "Beutiful in every Costume ;D " }
  ]
};
/* ====================================== */

const $ = id => document.getElementById(id);
$('names').innerHTML = `${CONFIG.yourName}<b>&amp;</b>${CONFIG.herName}`;
$('sign').textContent = CONFIG.signature;
$('letter').innerHTML = CONFIG.letter.map(p => `<p>${p}</p>`).join('');

/* Counter */
const start = new Date(CONFIG.start).getTime();
function tick(){
  let diff = Math.max(0, Date.now() - start);
  const s = Math.floor(diff/1000);
  $('d').textContent = Math.floor(s/86400);
  $('h').textContent = Math.floor(s%86400/3600);
  $('m').textContent = Math.floor(s%3600/60);
  $('s').textContent = s%60;
}
tick(); setInterval(tick, 1000);

/* Gallery */
const grid = $('grid'), lb = $('lb'), lbfig = $('lbfig');
CONFIG.photos.forEach(f => {
  const b = document.createElement('button');
  b.className = 'photo';
  b.innerHTML = `<div class="frame"><img loading="lazy" alt="${f.text}" src="${f.src}"></div><figcaption>${f.text}</figcaption>`;
  const img = b.querySelector('img');
  img.onerror = () => { img.replaceWith(document.createTextNode('💗')); b.dataset.missing = '1'; };
  b.onclick = () => {
    lbfig.innerHTML = b.dataset.missing
      ? `<div class="ph">💗</div><figcaption>${f.text}</figcaption>`
      : `<img alt="${f.text}" src="${f.src}"><figcaption>${f.text}</figcaption>`;
    lb.classList.add('open'); $('lbclose').focus();
  };
  grid.appendChild(b);
});
const closeLb = () => lb.classList.remove('open');
$('lbclose').onclick = closeLb;
lb.onclick = e => { if(e.target === lb) closeLb(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLb(); });
</script>
</body>
</html>
